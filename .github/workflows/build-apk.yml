name: 编译车机 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Melodia-1.12.1

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Remove desktopApp module
        run: |
          sed -i 's/^include(":desktopApp")/\/\/ include(":desktopApp")/' settings.gradle.kts
          sed -i 's/id("org.gradle.toolchains.foojay-resolver-convention")/\/\/ id("org.gradle.toolchains.foojay-resolver-convention")/' settings.gradle.kts

      - name: Remove aapt2 override
        run: sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName = ".*?"' app/build.gradle.kts | head -1 | grep -oP '"\K[^"]+')
          cp app/build/outputs/apk/debug/*.apk "编译_${VERSION:-1.0.0}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 编译_APK
          path: "Melodia-1.12.1/编译_*.apk"
